name: suivi-regime

services:
  mongo:
    image: mongo:7
    container_name: suivi-regime-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: suivi-regime
    volumes:
      - mongo-data:/data/db
    # Décommenter pour inspecter la base depuis l'hôte (Compass, mongosh).
    # ports:
    #   - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  fourchette-back-api:
    build:
      context: ./api
    image: suivi-regime-api
    container_name: fourchette-back-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/suivi-regime
      JWT_SECRET: ${JWT_SECRET:?definir JWT_SECRET dans .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?definir JWT_REFRESH_SECRET dans .env}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      # Origines navigateur autorisées. 8080 = conteneur web, 5173 = vite dev
      # lancé sur l'hôte contre cette API. À restreindre en production.
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      OFF_USER_AGENT: ${OFF_USER_AGENT:-SuiviRegime/1.0 (contact@example.com)}
      # Sans valeur, la console d'administration reste fermée à tout le monde.
      ADMIN_EMAILS: ${ADMIN_EMAILS-}
      # Sans ces clés, le push se désactive proprement et l'application
      # retombe sur le rappel in-app.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:contact@example.com}
      # Lecture hebdomadaire. Sans clé, le module se désactive et la carte
      # disparaît de l'écran des tendances.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY-}
      INSIGHTS_MONTHLY_BUDGET_EUR: ${INSIGHTS_MONTHLY_BUDGET_EUR:-20}
      INSIGHTS_USER_MONTHLY_BUDGET_EUR: ${INSIGHTS_USER_MONTHLY_BUDGET_EUR:-5}
      # Services tiers d'activité. Sans clé de chiffrement ni identifiants
      # OAuth, le module se désactive et le signale au démarrage.
      INTEGRATIONS_ENCRYPTION_KEY: ${INTEGRATIONS_ENCRYPTION_KEY-}
      INTEGRATIONS_CALLBACK_BASE_URL: ${INTEGRATIONS_CALLBACK_BASE_URL:-http://localhost:3001}
      INTEGRATIONS_WEB_APP_URL: ${INTEGRATIONS_WEB_APP_URL:-http://localhost:8080}
      GOOGLE_HEALTH_CLIENT_ID: ${GOOGLE_HEALTH_CLIENT_ID-}
      GOOGLE_HEALTH_CLIENT_SECRET: ${GOOGLE_HEALTH_CLIENT_SECRET-}
      STRAVA_CLIENT_ID: ${STRAVA_CLIENT_ID-}
      STRAVA_CLIENT_SECRET: ${STRAVA_CLIENT_SECRET-}
      # URI de retour déclarées chez les fournisseurs. Préfixe /api et non /v1 :
      # c'est le conteneur web qui réécrit l'un en l'autre, et le fournisseur ne
      # connaît que l'adresse publique.
      GOOGLE_HEALTH_REDIRECT_URI: ${GOOGLE_HEALTH_REDIRECT_URI-}
      STRAVA_REDIRECT_URI: ${STRAVA_REDIRECT_URI-}
      # Connexion par compte Google. Sans identifiants, le bouton n'est pas
      # affiché et le mot de passe reste le seul chemin.
      #
      # GOOGLE_LOGIN_REDIRECT_URI doit porter le préfixe /api, et non /v1 :
      # c'est le conteneur web qui réécrit l'un en l'autre, et Google comme le
      # navigateur ne connaissent que l'adresse publique.
      GOOGLE_LOGIN_CLIENT_ID: ${GOOGLE_LOGIN_CLIENT_ID-}
      GOOGLE_LOGIN_CLIENT_SECRET: ${GOOGLE_LOGIN_CLIENT_SECRET-}
      GOOGLE_LOGIN_REDIRECT_URI: ${GOOGLE_LOGIN_REDIRECT_URI-}
    ports:
      # Boucle locale uniquement. Le navigateur ne joint jamais l'API
      # directement : il passe par /api sur le conteneur web. Publier sur
      # 0.0.0.0 exposerait l'API en clair, hors TLS, sur le serveur.
      # Utile en local pour curl et Swagger.
      - "${BIND_ADDR:-127.0.0.1}:${API_PORT:-3001}:3001"

  fourchette-front-web:
    build:
      context: ./web
      args:
        # Vide = même origine : le client appelle /api sur le conteneur web,
        # qui réécrit vers /v1 de l'API. Ni CORS ni hôte en dur dans le bundle.
        VITE_API_URL: ${VITE_API_URL-}
    image: suivi-regime-web
    container_name: fourchette-front-web
    restart: unless-stopped
    depends_on:
      - fourchette-back-api
    ports:
      # Boucle locale : seul le reverse proxy de l'hôte relaie vers ce port.
      # Si le proxy est lui-même conteneurisé, retirer « ports » et le faire
      # rejoindre ce réseau compose.
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8080}:80"

volumes:
  mongo-data:

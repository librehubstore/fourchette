# Bloc de bordure pour Fourchette — suivi-regime.duckdns.org
#
# Destiné au nginx mutualisé de l'hôte, qui sert plusieurs applications.
# Déposer dans /etc/nginx/sites-available/ puis lier depuis sites-enabled/,
# ou directement dans /etc/nginx/conf.d/.
#
# Requiert nginx 1.25.1 ou plus récent pour la directive « http2 on ». Sur une
# version antérieure, la remplacer par « listen 443 ssl http2; ».
#
# Ce fichier ne définit AUCUNE règle applicative : ni bloc /api, ni fallback
# SPA, ni en-tête de cache. Tout cela vit dans web/nginx.conf, à l'intérieur du
# conteneur, et s'applique à l'identique en local et en production. Redéfinir
# une de ces règles ici recréerait la divergence entre les deux nginx, qui a
# déjà coûté cher sur ce projet.
#
# Mise en place — le bloc HTTPS ne démarre pas tant que le certificat manque,
# nginx refusant de charger un ssl_certificate absent :
#
#   1. déposer ce fichier avec le seul bloc HTTP (commenter le bloc 443)
#   2. mkdir -p /var/www/certbot
#   3. certbot certonly --webroot -w /var/www/certbot \
#        -d suivi-regime.duckdns.org
#   4. décommenter le bloc 443
#   5. nginx -t && systemctl reload nginx

server {
  listen      80;
  listen      [::]:80;
  server_name suivi-regime.duckdns.org;

  # Renouvellement Let's Encrypt en http-01. Ce chemin ne doit jamais partir en
  # redirection : le challenge échouerait et le certificat expirerait sans
  # bruit. « ^~ » lui donne priorité sur le « location / » ci-dessous.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen      443 ssl;
  listen      [::]:443 ssl;
  http2       on;
  server_name suivi-regime.duckdns.org;

  ssl_certificate     /etc/letsencrypt/live/suivi-regime.duckdns.org/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/suivi-regime.duckdns.org/privkey.pem;

  ssl_protocols             TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache         shared:SSL:10m;
  ssl_session_timeout       1d;
  ssl_session_tickets       off;

  # HSTS : engagement de six mois. Une fois l'en-tête reçu, le navigateur
  # refusera tout accès en clair à ce domaine pendant toute la durée, même si
  # le certificat vient à manquer. À n'activer qu'une fois HTTPS stable.
  add_header Strict-Transport-Security "max-age=15552000; includeSubDomains" always;

  add_header X-Content-Type-Options "nosniff"                         always;
  add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options        "DENY"                            always;

  # La caméra est indispensable au scan de codes-barres. Les jeux d'en-têtes
  # tout faits contiennent presque toujours « camera=() », qui la désactive
  # silencieusement : le scanner échouerait sans message explicite.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

  # Aucun envoi de fichier dans l'application : les codes-barres sont du texte.
  client_max_body_size 1m;

  location / {
    proxy_pass http://127.0.0.1:8080;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # $scheme vaut « https » ici : c'est ce bloc qui termine TLS. Le conteneur
    # web relaie ensuite cette valeur telle quelle jusqu'à l'API, qui s'en sert
    # pour identifier le client via « trust proxy ».
    proxy_set_header X-Forwarded-Proto $scheme;

    # Connexions persistantes vers le conteneur : évite une poignée de main TCP
    # par requête, ce qui compte pour une SPA qui charge plusieurs assets.
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
  }
}
